1" letter-spacing="1.4">НАУКА</text><text x="104" y="270" font-family="DejaVu Sans, sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#f1eadc" opacity="1" letter-spacing="0">Выберите исследование</text><text x="104" y="325" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#c1c2b8"><tspan x="104" dy="0">Знания открывают новые районы и помогают городу</tspan><tspan x="104" dy="34">справляться с голодом, болезнями и кризисами.</tspan></text><text x="104" y="446" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#d1ab62" opacity="1" letter-spacing="0">ЦЕЛЬ</text><path d="M104 461 L1174 461" fill="none" stroke="#f1eadc" stroke-width="1" opacity="0.24"/><text x="104" y="497" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#f1eadc"><tspan x="104" dy="0">Изучите технологию, которая поможет вашей столице.</tspan></text><text x="104" y="590" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#c1c2b8" opacity="1" letter-spacing="0">Сначала откройте вкладку «Наука». Выберите доступную технологию.</text><path d="M104 839 L384 839" fill="none" stroke="#f1eadc" stroke-width="1" opacity="0.17"/><text x="244.0" y="816.26" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="650" text-anchor="middle" fill="#f1eadc" opacity="0.92" letter-spacing="0">ПРЕДЫДУЩИЙ УРОК</text><path d="M405 839 L660 839" fill="none" stroke="#f1eadc" stroke-width="1" opacity="0.17"/><text x="532.5" y="816.6" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="650" text-anchor="middle" fill="#f1eadc" opacity="0.92" letter-spacing="0">ПРОПУСТИТЬ</text><rect x="947" y="784" width="255" height="55" rx="8" fill="#d1ab62" opacity="0.96"/><text x="1074.5" y="817.28" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#111714" opacity="1