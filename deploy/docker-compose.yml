# Backend on one small AWS machine: the game server plus Caddy, which gets a free HTTPS certificate by itself.
# Usage (on the machine, in this folder):  API_HOST=api.example.com FRONTEND_ORIGIN=https://play.example.com docker compose up -d --build
services:
  game:
    build: ..
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN, e.g. https://play.example.com}
    volumes:
      - jericho-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST:?set API_HOST, e.g. api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - game
volumes:
  jericho-data:
  caddy-data:
