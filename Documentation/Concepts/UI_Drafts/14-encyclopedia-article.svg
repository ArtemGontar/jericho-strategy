сигнал, что городу не хватает устойчивости.</text><text x="72" y="265" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#a96956" opacity="1" letter-spacing="0">ЧТО ВЫЗЫВАЕТ ОТТОК</text><path d="M72 280 L872 280" fill="none" stroke="#f1eadc" stroke-width="1" opacity="0.24"/><text x="72" y="316" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#f1eadc"><tspan x="72" dy="0">Нехватка еды и рабочих мест</tspan><tspan x="72" dy="30">Здоровье или доверие долго остаются низкими</tspan><tspan x="72" dy="30">Военные расходы разрушают торговлю и быт</tspan></text><text x="1010" y="265" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#87a17d" opacity="1" letter-spacing="0">КАК ВЕРНУТЬ УСТОЙЧИВОСТЬ</text><path d="M1010 280 L1810 280" fill="none" stroke="#f1eadc" stroke-width="1" opacity="0.24"/><text x="1010" y="316" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#f1eadc"><tspan x="1010" dy="0">Сверьте запасы с прогнозом потребления</tspan><tspan x="1010" dy="30">Переведите часть жителей в земледелие</tspan><tspan x="1010" dy="30">Восстановите районы и торговые связи</tspan></text><path d="M72 570 L1810 570" fill="none" stroke="#f1eadc" stroke-width="1" opacity="0.22"/><text x="72" y="621" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#829887" opacity="1" letter-spacing="1">СВЯЗАННЫЕ ТЕМЫ</text><text x="72" y="666" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="450" text-anchor="start" fill="#f1eadc" opacity="1" letter-spacing="0">Городская устойчивость     ·     Продовольствие     ·     Военная нагрузка</text></svg>